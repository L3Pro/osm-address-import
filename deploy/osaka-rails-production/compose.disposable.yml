services:
  db:
    image: ${OSM_DB_IMAGE:?pin the local database image digest}
    environment:
      POSTGRES_DB: openstreetmap
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [isolated]
    mem_limit: 1536m
    cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openstreetmap"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    image: ${OSM_RAILS_IMAGE:?pin the local Rails image digest}
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    working_dir: /app
    env_file: ${OSM_PRIVATE_ENV_FILE:?private env file required}
    environment:
      RAILS_ENV: production
      RACK_ENV: production
      RAILS_SERVE_STATIC_FILES: "true"
      RAILS_LOG_LEVEL: info
    volumes:
      - ${OSM_APP_COPY:?private app copy required}:/app
    networks: [isolated]
    mem_limit: 1024m
    cpus: 1.0
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --max-time 5 http://127.0.0.1:3000/api/0.6/capabilities.json >/dev/null"]
      interval: 10s
      timeout: 6s
      retries: 12

volumes:
  db-data:

networks:
  isolated:
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
